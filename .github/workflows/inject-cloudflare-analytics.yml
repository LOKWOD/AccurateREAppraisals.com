name: Build content, optimize performance, and install Cloudflare Web Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accurate-site-content
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate expanded appraisal library
        run: |
          node scripts/generate-expansion.mjs
          node scripts/generate-expansion-two.mjs

      - name: Self-host and preload the homepage LCP image
        run: python scripts/optimize-homepage-lcp.py

      - name: Inject analytics into all HTML pages
        run: node scripts/inject-cloudflare-analytics.mjs

      - name: Verify the homepage performance fix
        run: |
          test -s assets/images/central-new-york-homes.jpg
          grep -Fq '/assets/images/central-new-york-homes.jpg' assets/style.css
          grep -Fq 'fetchpriority="high"' index.html
          ! grep -Fq 'Special:FilePath/New_housing_development%2C_Clay%2C_NY.jpg' index.html

      - name: Commit generated, optimized, and normalized site files
        run: |
          if git diff --quiet; then
            echo "Site content and performance assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish optimized Accurate appraisal site"
          git pull --rebase origin main
          git push origin HEAD:main
