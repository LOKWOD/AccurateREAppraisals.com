name: Install appraisal cash-register chime

on:
  push:
    paths:
      - .github/workflows/install-cash-register-chime.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject chime script into HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker='<!-- Appraisal Cash Register Chime -->'
          block=marker+'<script defer src="/assets/cash-register.js"></script><!-- End Appraisal Cash Register Chime -->'
          changed=0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              lower=s.lower()
              i=lower.rfind('</body>')
              if i < 0:
                  continue
              s=s[:i]+'\n'+block+'\n'+s[i:]
              p.write_text(s, encoding='utf-8')
              changed+=1
          print(f'Injected chime into {changed} HTML pages.')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git commit -m 'Enable first-interaction appraisal chime'
          git push
